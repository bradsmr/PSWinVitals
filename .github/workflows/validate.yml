name: Validate standalone script

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: "1"

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse and run tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Invoke-Tests.ps1

  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run portable logic and filesystem tests
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1
