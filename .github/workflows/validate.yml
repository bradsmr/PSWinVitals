name: Validate standalone script

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: "1"

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse and run tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Invoke-Tests.ps1

  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run portable logic and filesystem tests
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1
